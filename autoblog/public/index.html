<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Daily Gift Guide</title>

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
         crossorigin="anonymous"></script>

    <style>
        :root {
            --primary-color: #333;
            --secondary-color: #555;
            --background-color: #fff;
            --accent-color: #007bff;
            --border-color: #eee;
            --ad-background: #f9f9f9;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            line-height: 1.7;
            padding: 15px;
            max-width: 800px; /* Limit content width for readability */
            margin: 20px auto; /* Center content */
            color: var(--primary-color);
            background-color: var(--background-color);
        }
        header, footer {
            text-align: center;
            margin-bottom: 30px;
            color: var(--secondary-color);
        }
        h1#guide-title {
            color: #1a1a1a;
            font-size: 2em; /* Larger title */
            margin-bottom: 0.5em;
        }
        article#guide-content {
            margin-top: 20px;
        }
        /* Styling for generated HTML content */
        #guide-content h2 {
            margin-top: 2em;
            margin-bottom: 0.8em;
            padding-bottom: 0.3em;
            border-bottom: 2px solid var(--border-color);
            color: var(--primary-color);
            font-size: 1.5em;
        }
        #guide-content p {
            margin-bottom: 1.2em;
        }
        #guide-content img {
            max-width: 100%; /* Ensure images are responsive */
            height: auto;
            display: block; /* Center images if they are block */
            margin: 1.5em auto; /* Add space around images */
            border-radius: 8px; /* Slightly rounded corners for images */
        }
        #guide-content a { /* Style links within content */
            color: var(--accent-color);
            text-decoration: none;
        }
        #guide-content a:hover {
            text-decoration: underline;
        }
        /* Style for AdSense block */
        .ad-container {
            margin: 40px 0; /* More vertical space around ad */
            padding: 20px 0;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            background-color: var(--ad-background);
        }
        /* Loading/Error State */
        .status-message {
            color: var(--secondary-color);
            font-style: italic;
            text-align: center;
            margin-top: 40px;
        }

        /* Responsive Adjustments */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            h1#guide-title {
                font-size: 1.6em;
            }
            #guide-content h2 {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1 id="guide-title">Loading Today's Gift Guide...</h1>
    </header>

    <main>
        <article id="guide-content">
            <p class="status-message">Please wait while the latest guide is loaded.</p>
        </article>

        <div class="ad-container">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"  data-ad-slot="YYYYYYYYYY"            data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            </div>
    </main>

    <footer>
        <p><small>Guide generated daily using AI. Advertising supports this site.</small></p>
    </footer>

    <script>
      // Immediately Invoked Async Function Expression (IIAFE) to scope variables
      (async () => {
        // --- Configuration ---
        // !!! IMPORTANT: Replace with YOUR actual deployed PocketBase Render service URL !!!
        const PB_URL = 'https://yourname-giftguides-pb.onrender.com'; // Example URL

        // Get references to the HTML elements we need to update
        const titleElement = document.getElementById('guide-title');
        const contentElement = document.getElementById('guide-content');

        // --- Fetch Latest Guide ---
        try {
          // Fetch the latest 1 record from the 'guides' collection, sorted newest first
          const response = await fetch(`${PB_URL.replace(/\/$/, '')}/api/collections/guides/records?sort=-publishedAt&perPage=1`);

          // Check if the fetch was successful
          if (!response.ok) {
            // Throw an error with details if the response status is not OK (e.g., 404, 500)
            throw new Error(`HTTP error! Status: ${response.status} ${response.statusText}`);
          }

          // Parse the JSON response body
          const data = await response.json();

          // Check if the response contains items
          if (data.items && data.items.length > 0) {
            // Get the first (latest) guide item
            const [latestGuide] = data.items;
            // Update the page title and content
            titleElement.textContent = latestGuide.title;
            // Directly inject the HTML content from PocketBase.
            // WARNING: Only do this if you trust the source of the HTML (the AI generation process).
            // If the AI could generate malicious scripts, consider using a sanitizer library (like DOMPurify) here.
            contentElement.innerHTML = latestGuide.contentHTML;
            console.log("Successfully loaded guide:", latestGuide.title);
          } else {
             // Handle the case where no guides are found in PocketBase yet
             titleElement.textContent = 'No Guide Available Yet';
             contentElement.innerHTML = '<p class="status-message">The first guide hasn\'t been generated yet. Please check back later!</p>';
             console.log("No guides found in PocketBase collection.");
          }
        } catch (error) {
           // Handle any errors during the fetch process
           console.error("Failed to fetch or process guide:", error);
           titleElement.textContent = 'Failed to Load Guide';
           contentElement.innerHTML = `<p class="status-message">Sorry, there was an error loading the latest guide. Please try refreshing the page later. Error details: ${error.message}</p>`;
        }

        // --- AdSense Setup Step 3: Initialize Ad ---
        // This should be called after the main content is potentially loaded.
        try {
          // Check if adsbygoogle is initialized, if not use empty array, then push config.
          (adsbygoogle = window.adsbygoogle || []).push({});
          console.log("AdSense ad push attempted.");
        } catch (adError) {
          // Log errors related to AdSense initialization
          console.error("AdSense initialization error:", adError);
        }
      })();
    </script>
</body>
</html>
