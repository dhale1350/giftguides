# render.yaml - Defines the services for the Automated Gift Guide Blog on Render

services:
  # 1. PocketBase Backend Service
  #    Runs the PocketBase application using the Dockerfile.
  - type: web # 'web' type indicates a service accessible via HTTP/S
    name: giftguides-pb # Choose a unique name for the service (e.g., yourname-giftguides-pb)
                       # This forms part of the default URL: name.onrender.com
    env: docker # Specifies that this service is built from a Dockerfile
    dockerfilePath: ./Dockerfile # Path to the Dockerfile in the repository root
    plan: free # Specifies the instance type. 'free' tier has limitations.
    disk:
      name: pb-data # A name for the persistent disk volume
      mountPath: /pb/pb_data # The path *inside the container* where the disk should be mounted.
                             # This MUST match where PocketBase stores its data.
      sizeGB: 1 # The size of the persistent disk in GB. 1GB is the smallest available size.
    envVars:
      - key: PORT # Render injects this environment variable with the port the service should listen on.
        value: 8080 # Set the value Render expects. Must match EXPOSE/CMD in Dockerfile.
    healthCheckPath: /api/health # Optional Health Check for PocketBase

  # 2. Static Frontend Service
  #    Serves the static HTML, CSS, and JavaScript files for the blog interface.
  - type: web # *** CORRECTED TYPE: Use 'web' for static sites in Blueprints ***
    name: auto-gift-guides # Choose a unique name for the frontend service (e.g., yourname-gift-guides)
    runtime: static # *** CORRECTED RUNTIME: Specify 'static' runtime for type: web ***
    plan: free # Use Render's free static site hosting tier (via runtime: static)
    rootDir: public # The directory in the repository containing the static files (index.html, etc.)
    # Static sites with runtime: static don't need a build command unless processing assets
    # buildCommand: # Optional: Add if you need a build step (e.g., npm run build)
    # staticPublishPath: ./public # Optional: Specify if build output is different from rootDir
    pullRequestPreviewsEnabled: true # Optional: Automatically builds and deploys previews for GitHub pull requests.
    buildFilter: # Optional: Controls when Render triggers a new build/deploy for this service.
      paths:
      - public/** # Only trigger a deploy if files within the 'public' directory change.
