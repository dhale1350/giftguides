# render.yaml - Defines the services for the Automated Blog on Render
# Corrected configuration for serving static files directly from the 'public' directory.

services:
  # 1. Static Frontend Service
  #    Serves the static HTML, CSS, and JavaScript files from the 'public' directory.
  - type: web # Use 'web' for static sites
    name: daily-reads # Service name
    runtime: static # Specify 'static' runtime
    # staticPublishPath: Specifies the directory relative to the repository root
    #                    containing the static files to be served.
    staticPublishPath: ./public
    # rootDir is generally not needed for simple static sites with no build step
    # where staticPublishPath is relative to the repo root.

    pullRequestPreviewsEnabled: true # Optional: Enable PR previews

    # buildFilter: Only trigger deploys if files within the 'public' directory change.
    buildFilter:
      paths:
      - public/**

# Note: Ensure your index.html is directly inside the 'public' folder
# at the root of your GitHub repository.
