# render.yaml - Defines the services for the Automated Blog on Render
# This version ONLY includes the static frontend site, assuming the backend
# is handled by a separate service like Supabase.

services:
  # 1. Static Frontend Service
  #    Serves the static HTML, CSS, and JavaScript files for the blog interface.
  - type: web # Use 'web' for static sites in Blueprints
    name: daily-reads # *** RENAMED service name ***
    runtime: static # Specify 'static' runtime for type: web
    # Removed 'plan: free' - Render should infer free static hosting from runtime: static
    rootDir: public # The directory in the repository containing the static files (index.html, etc.)
    pullRequestPreviewsEnabled: true # Optional: Automatically builds and deploys previews for GitHub pull requests.
    buildFilter: # Optional: Controls when Render triggers a new build/deploy for this service.
      paths:
      - public/** # Only trigger a deploy if files within the 'public' directory change.

# Note: The PocketBase web service definition has been removed.
