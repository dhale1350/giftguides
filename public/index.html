        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            line-height: 1.7; padding: 15px; max-width: 800px; margin: 20px auto; color: var(--primary-color); background-color: var(--background-color);
        }
        header, footer { text-align: center; margin-bottom: 30px; color: var(--secondary-color); }
        h1#guide-title { color: #1a1a1a; font-size: 2em; margin-bottom: 0.5em; }
        article#guide-content { margin-top: 20px; }
        #guide-content h2 { margin-top: 2em; margin-bottom: 0.8em; padding-bottom: 0.3em; border-bottom: 2px solid var(--border-color); color: var(--primary-color); font-size: 1.5em; }
        #guide-content p { margin-bottom: 1.2em; }
        #guide-content img { max-width: 100%; height: auto; display: block; margin: 1.5em auto; border-radius: 8px; }
        #guide-content a { color: var(--accent-color); text-decoration: none; }
        #guide-content a:hover { text-decoration: underline; }
        .ad-container { margin: 40px 0; padding: 20px 0; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); text-align: center; background-color: var(--ad-background); }
        .status-message { color: var(--secondary-color); font-style: italic; text-align: center; margin-top: 40px; }
        @media (max-width: 600px) {
            body { padding: 10px; }
            h1#guide-title { font-size: 1.6em; }
