<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Reads Blog</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
         crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Optional: Tailwind configuration if needed
        // tailwind.config = { ... }
    </script>
    <style>
        /* Basic styles - Tailwind will handle most styling */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        }
        /* Style for the active tab */
        .tab-active {
            border-bottom-color: #3b82f6; /* Example: blue-500 */
            color: #3b82f6;
            font-weight: 600;
        }
        /* Style for generated content within posts if needed */
        .blog-post-content h2 {
            font-size: 1.4em;
            font-weight: 600;
            margin-top: 1.5em;
            margin-bottom: 0.8em;
            padding-bottom: 0.3em;
            border-bottom: 1px solid #eee; /* Example: gray-200 */
        }
        .blog-post-content p {
            margin-bottom: 1.2em;
            line-height: 1.7;
        }
        .blog-post-content ul, .blog-post-content ol {
            margin-left: 1.5rem;
            margin-bottom: 1.2em;
        }
        .blog-post-content li {
            margin-bottom: 0.5em;
        }
        .blog-post-content a {
            color: #3b82f6; /* Example: blue-500 */
            text-decoration: underline;
        }
        .blog-post-content a:hover {
             color: #2563eb; /* Example: blue-600 */
        }
        /* Ensure images within content are responsive */
         .blog-post-content img {
             max-width: 100%;
             height: auto;
             margin-top: 1em;
             margin-bottom: 1em;
             border-radius: 0.5rem; /* rounded-lg */
         }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="container mx-auto max-w-3xl px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900">Daily Reads Blog</h1>
            <p class="text-gray-600">Your daily dose of interesting reads.</p>
        </header>

        <nav class="mb-8 border-b border-gray-300">
            <ul class="flex flex-wrap -mb-px text-sm font-medium text-center text-gray-500">
                <li class="mr-2">
                    <a href="#" id="tab-home" class="tab-link inline-block p-4 border-b-2 rounded-t-lg tab-active" data-tab="home">Home</a>
                </li>
                <li class="mr-2">
                    <a href="#" id="tab-Technology" class="tab-link inline-block p-4 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300" data-tab="Technology">Technology</a>
                </li>
                 <li class="mr-2">
                    <a href="#" id="tab-Lifestyle" class="tab-link inline-block p-4 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300" data-tab="Lifestyle">Lifestyle</a>
                </li>
                 <li class="mr-2">
                    <a href="#" id="tab-Food" class="tab-link inline-block p-4 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300" data-tab="Food">Food</a>
                </li>
                 <li class="mr-2">
                    <a href="#" id="tab-Travel" class="tab-link inline-block p-4 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300" data-tab="Travel">Travel</a>
                </li>
                <li class="mr-2">
                    <a href="#" id="tab-Books" class="tab-link inline-block p-4 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300" data-tab="Books">Books</a>
                </li>
                 <li class="mr-2">
                    <a href="#" id="tab-General" class="tab-link inline-block p-4 border-b-2 border-transparent rounded-t-lg hover:text-gray-600 hover:border-gray-300" data-tab="General">General</a>
                </li>
            </ul>
        </nav>

        <main id="main-content">
             <div id="blog-posts-container">
                 <p id="status-message" class="text-center text-gray-500 italic mt-10 p-5 bg-gray-100 rounded-md">Loading posts...</p>
             </div>
             </main>

        <div class="ad-container my-10 py-5 border-t border-b border-gray-200 text-center bg-gray-100">
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
                 data-ad-slot="YYYYYYYYYY"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
        </div>

        <footer class="text-center mt-8 text-gray-600">
            <p><small>Content by CMRS. Advertising supports this site.</small></p>
        </footer>
    </div>

    <script>
      // --- Configuration ---
      const SUPABASE_URL = 'https://gbxdhqqlbandnhvfkbtr.supabase.co'; // Your Supabase URL
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdieGRocXFsYmFuZG5odmZrYnRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDYxMDAwOTQsImV4cCI6MjA2MTY3NjA5NH0.W_T6oa1lSbZ-9W_E5Jo66c9ShK_FVoc1zJTZ7vir6eY'; // Your Supabase Anon Key
      const POSTS_LIMIT = 20; // How many recent posts to display per category/page

      // --- DOM References ---
      const mainContent = document.getElementById('main-content');
      const tabLinks = document.querySelectorAll('.tab-link');
      const postsContainer = document.getElementById('blog-posts-container');
      // statusMessage ref removed as loading is handled within loadPosts

      // --- Functions ---

      // Function to format date
      function formatDate(isoString) {
          if (!isoString) return '';
          try {
              const date = new Date(isoString);
              return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
          } catch (e) {
              console.error("Error formatting date:", e);
              return '';
          }
      }

      // --- MODIFIED: Function to fetch and display posts (handles category filtering) ---
      async function loadPosts(category = null) {
          // Show loading message inside the container
          postsContainer.innerHTML = `<p id="status-message" class="text-center text-gray-500 italic mt-10 p-5 bg-gray-100 rounded-md">Loading posts${category ? ` for ${category}` : ''}...</p>`;

          try {
              // Base URL
              let fetchURL = `${SUPABASE_URL}/rest/v1/guides?select=*&order=publishedAt.desc&limit=${POSTS_LIMIT}`;
              
              // Add category filter if provided and not 'home'
              if (category && category.toLowerCase() !== 'home') {
                  fetchURL += `&category=eq.${encodeURIComponent(category)}`;
                  console.log(`Fetching category: ${category}`);
              } else {
                   console.log("Fetching latest posts (Home)");
              }

              const response = await fetch(fetchURL, {
                  headers: {
                      'apikey': SUPABASE_ANON_KEY,
                      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                  }
              });

              if (!response.ok) {
                  throw new Error(`HTTP error! Status: ${response.status} ${response.statusText}`);
              }

              const posts = await response.json();
              postsContainer.innerHTML = ''; // Clear loading/previous content

              if (posts && posts.length > 0) {
                  console.log(`Loaded ${posts.length} posts from Supabase.`);
                  posts.forEach(post => {
                      const article = document.createElement('article');
                      // Added Tailwind classes for styling posts
                      article.className = 'blog-post bg-white p-6 rounded-lg shadow-sm mb-8 border border-gray-200'; 

                      const title = document.createElement('h2'); // Use H2 for post titles
                      title.className = 'blog-post-title text-2xl font-semibold text-gray-900 mb-2';
                      title.textContent = post.title || 'Untitled Post';

                      const meta = document.createElement('p');
                      meta.className = 'blog-post-meta text-sm text-gray-500 mb-4';
                      // Optionally display category along with date
                      const categoryText = post.category ? ` | Category: ${post.category}` : '';
                      meta.textContent = `Published on: ${formatDate(post.publishedAt)}${categoryText}`;

                      const contentDiv = document.createElement('div');
                      contentDiv.className = 'blog-post-content text-gray-700';
                      // WARNING: Setting innerHTML requires trust or sanitization.
                      contentDiv.innerHTML = post.contentHTML || '<p>Content not available.</p>';

                      article.appendChild(title);
                      article.appendChild(meta);
                      article.appendChild(contentDiv);

                      postsContainer.appendChild(article);
                  });
              } else {
                  const noPostsMessage = document.createElement('p');
                  noPostsMessage.className = 'text-center text-gray-500 italic mt-10 p-5 bg-gray-100 rounded-md';
                  noPostsMessage.textContent = `No blog posts found${category ? ` for the '${category}' category` : ''} yet. Please check back later!`;
                  postsContainer.appendChild(noPostsMessage);
                  console.log(`No posts found in Supabase table${category ? ` for category '${category}'` : ''}.`);
              }
          } catch (error) {
              console.error("Failed to fetch or process posts from Supabase:", error);
              // Display error message inside the container
              postsContainer.innerHTML = `<p id="status-message" class="text-center text-red-600 mt-10 p-5 bg-red-100 rounded-md">Sorry, there was an error loading posts. Please try refreshing the page later. Error: ${error.message}</p>`;
          }
      }

      // Function to switch tabs
      function switchTab(tabId) {
          // Deactivate all tab links
          tabLinks.forEach(link => {
              link.classList.remove('tab-active', 'text-blue-600', 'border-blue-600');
              link.classList.add('border-transparent', 'hover:text-gray-600', 'hover:border-gray-300');
          });

          // Activate the selected tab link
          // Use data-tab attribute for selecting the correct link
          const activeLink = document.querySelector(`.tab-link[data-tab='${tabId}']`);
          if (activeLink) {
              activeLink.classList.add('tab-active', 'text-blue-600', 'border-blue-600');
              activeLink.classList.remove('border-transparent', 'hover:text-gray-600', 'hover:border-gray-300');
          }

          // Load content based on the tabId ('home' or the category name)
          // Pass null for 'home' to load all posts, otherwise pass the category name
          loadPosts(tabId === 'home' ? null : tabId);
      }

      // --- Event Listeners ---
      tabLinks.forEach(link => {
          link.addEventListener('click', (event) => {
              event.preventDefault(); // Prevent default link behavior
              const tabId = event.target.getAttribute('data-tab');
              switchTab(tabId);
          });
      });

      // --- Initial Load ---
      // Load home posts by default when the page loads
      switchTab('home');

      // --- AdSense Initialization ---
      if (typeof adsbygoogle !== 'undefined') {
          try {
              (adsbygoogle = window.adsbygoogle || []).push({});
              console.log("AdSense ad push attempted.");
          } catch (adError) {
              console.error("AdSense initialization error:", adError);
          }
      } else {
          console.log("AdSense script not found, skipping ad initialization.");
      }

    </script>
</body>
</html>
