# .github/workflows/generate.yml
# GitHub Actions workflow to automatically run the Python script daily,
# saving generated content to Supabase.

name: Daily Guide Generation (Supabase)

on:
  schedule:
    # Trigger the workflow at 08:00 UTC every day.
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  generate-guide:
    runs-on: ubuntu-latest # Use the latest Ubuntu runner

    # Environment variables needed by the Python script
    # These are sourced from GitHub repository secrets
    env:
      # Supabase Credentials
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }} # Use Service Role Key for backend script

      # Google Cloud Credentials
      GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
      GCP_LOCATION: ${{ secrets.GCP_LOCATION }}

      # Python configuration
      PYTHONUNBUFFERED: "1"

    steps:
      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Python environment
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Cache dependencies

      # Step 3: Install Python dependencies (including supabase-py)
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      # Step 4: Authenticate to Google Cloud for Vertex AI
      # Configures Application Default Credentials (ADC) using the SA key secret
      - name: Set up Google Cloud SDK and Auth
        uses: google-github-actions/setup-gcloud@v2
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT }}

      # Step 5: Run the Python generator script
      # The script will use Supabase env vars and Google Cloud ADC
      - name: Run Guide Generator Script (Python/Supabase)
        run: python scripts/generate_guide.py
